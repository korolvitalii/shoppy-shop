<form class="search-form" role="search" [formGroup]="searchForm" (ngSubmit)="search()">
  <label class="visually-hidden" for="site-search" i18n="@@searchProducts">Search products</label>
  <input
    id="site-search"
    type="search"
    formControlName="query"
    placeholder="Search products, brands and more"
    i18n-placeholder="@@searchPlaceholder"
    autocomplete="off"
    role="combobox"
    aria-autocomplete="list"
    aria-controls="search-suggestions"
    [attr.aria-expanded]="suggestionsOpen()"
    [attr.aria-activedescendant]="
      activeSuggestionIndex() >= 0 ? suggestionId(activeSuggestionIndex()) : null
    "
    (focus)="showSuggestions()"
    (keydown)="handleSearchKeydown($event)"
  />
  <label class="visually-hidden" for="search-category" i18n="@@searchCategory"
    >Search category</label
  >
  <select id="search-category" formControlName="category">
    <option value="all" i18n="@@allCategories">All categories</option>
    @for (category of categories; track category.id) {
      <option [value]="category.id">{{ category.label }}</option>
    }
  </select>
  <button class="search-button" type="submit">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="10.7" cy="10.7" r="6.7" />
      <path d="m16 16 4 4" />
    </svg>
    <span i18n="@@searchAction">Search</span>
  </button>
  @if (suggestionsOpen()) {
    <app-search-suggestions
      id="search-suggestions"
      role="listbox"
      [products]="suggestions()"
      [activeIndex]="activeSuggestionIndex()"
      [query]="searchForm.controls.query.value.trim()"
      (activeIndexChange)="activeSuggestionIndex.set($event)"
      (productSelected)="openSuggestion($event)"
    />
  }
</form>
